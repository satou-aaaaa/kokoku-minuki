<style>
/* 広告しらべの机：生成りの机に、調べる係の赤ペンと藍のスタンプ */
:root{
  --bg:#f3eee4; --paper:#fffdf8; --ink:#22263a; --ink2:#4d5266; --line:#22263a26;
  --ai:#1f4f8a; --ai2:#143866; --shu:#b3402a; --shu2:#842c1b; --ok:#22704a; --ok2:#174f33; --gold:#9a6a0c;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  color-scheme:light;
}
html{height:100%;font-size:18px}body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-weight:500;-webkit-tap-highlight-color:transparent;line-height:1.6}
.wrap{max-width:540px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 88px;display:flex;flex-direction:column;gap:14px;min-height:100vh;box-sizing:border-box}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:52px}
h1{font-weight:900;font-size:1.1rem;margin:0;letter-spacing:.04em;flex:1;min-width:0}
h1 small{display:block;font-size:.75rem;letter-spacing:0;color:var(--ink2);font-weight:500;line-height:1.3}
.icon{all:unset;cursor:pointer;font-size:1.2rem;min-width:48px;height:48px;display:grid;place-items:center;border-radius:12px;border:2px solid var(--line);box-sizing:border-box;padding:0 10px;background:var(--paper);font-weight:700}
button.main,a.main{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;min-height:60px;border-radius:16px;background:var(--shu);color:#fff;font-weight:900;font-size:1.05rem;padding:8px 18px;text-align:center;box-shadow:0 5px 0 var(--shu2);line-height:1.35;flex-wrap:wrap}
button.main:active{transform:translateY(3px);box-shadow:0 2px 0 var(--shu2)}
button.main.alt{background:var(--ai);box-shadow:0 5px 0 var(--ai2)}
button.main.ok{background:var(--ok);box-shadow:0 5px 0 var(--ok2)}
button.main small{font-weight:500;font-size:.8rem}
button.sub,a.sub{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;min-height:52px;border-radius:14px;border:2px solid var(--line);background:var(--paper);color:var(--ink);font-weight:700;font-size:.95rem;padding:4px 12px;text-align:center;line-height:1.3}
button.sub:disabled,button.main:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px}.row>.sub,.row>.main{flex:1 1 0}
.note{color:var(--ink2);font-size:.85rem;line-height:1.7;margin:0;text-align:center}
.note a,.about a,.verdict a{color:var(--shu2);display:inline-flex;align-items:center;min-height:44px}
.big{font-weight:900;font-size:1.45rem;text-align:center;margin:0;line-height:1.35}
.title{flex:none;font-weight:900;font-size:2.2rem;letter-spacing:.12em;text-align:center;margin:8px 0 0;color:var(--ai2)}
.title span{color:var(--shu)}
.lead{text-align:center;color:var(--ink2);margin:0;font-size:.95rem;line-height:1.7}
.tip{background:var(--paper);border:2px dashed var(--gold);border-radius:14px;padding:.6rem .9rem;font-size:.9rem;line-height:1.7;text-align:left}
.tip b{color:var(--shu2)}
/* 広告のカード */
.q{margin:0;font-weight:900;font-size:1rem;text-align:center}
.ad{background:#fff;border:2px solid #22263a40;border-radius:14px;overflow:hidden;box-shadow:0 8px 20px #22263a22;display:flex;flex-direction:column}
.ad .band{color:#fff;font-weight:900;font-size:.8rem;padding:6px 12px;display:flex;justify-content:space-between;letter-spacing:.06em}
.ad .band i{font-style:normal;font-weight:500;opacity:.95}
.ad .body{display:flex;flex-direction:column;gap:6px;padding:10px}
.pt{all:unset;box-sizing:border-box;cursor:pointer;position:relative;border:2px dashed transparent;border-radius:10px;padding:6px 8px;min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--ink);transition:border-color .15s,background .15s}
.pt:hover{border-color:#22263a55;background:#22263a08}
.pt.p-img{flex-direction:column;gap:2px;font-size:.85rem;color:var(--ink2);font-weight:700}
.pt.p-img .art{font-size:3.2rem;line-height:1.1;width:5.2rem;height:5.2rem;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#fff 0,#f4ead8 60%,#e8d9bd 100%);box-shadow:inset 0 -4px 0 #0000000f}
.pt.p-head{font-weight:900;font-size:1.45rem;line-height:1.3;color:#7a1f10;letter-spacing:.02em;background:linear-gradient(transparent 62%,#ffe08a 62%) no-repeat padding-box}
.pt.p-sub{font-weight:700;font-size:.95rem;color:var(--ink2)}
.pt.p-price{font-weight:900;font-size:1.15rem;color:var(--ink)}
.pt.p-cta{align-self:center;background:#f2a33a;color:#2b1a00;font-weight:900;border-radius:999px;padding:8px 22px;box-shadow:0 3px 0 #b8741c}
.pt.p-note{font-size:.8rem;line-height:1.5;color:#4d5266;text-align:left;justify-content:flex-start;background:#f5f3ee}
.pt.p-user{justify-content:flex-start;gap:8px;font-size:.85rem;color:var(--ink2);font-weight:700}
.pt.p-user .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;flex:none}
.pt.p-body{justify-content:flex-start;text-align:left;font-size:1rem;line-height:1.6}
.pt.p-tags{justify-content:flex-start;text-align:left;font-size:.85rem;color:#1f4f8a;line-height:1.6;word-break:break-all}
.ad.sns .pt.p-img .art{border-radius:12px;width:100%;height:6rem;font-size:3.4rem}
.ad.sns .likes{font-size:.8rem;color:var(--ink2);padding:0 10px 10px}
.pt.ng{border-color:var(--shu);border-style:dashed;opacity:.6;cursor:default;animation:shake .4s}
.pt.ng::after{content:"✕ ちがう";position:absolute;top:-10px;right:6px;background:var(--shu2);color:#fff;font-size:.7rem;font-weight:900;padding:1px 6px;border-radius:6px}
.pt.ok{border-color:var(--ok);border-style:solid;border-width:3px;background:#eef7f0}
.pt.ok::after{content:"✓ ここ";position:absolute;top:-10px;right:6px;background:var(--ok2);color:#fff;font-size:.7rem;font-weight:900;padding:1px 6px;border-radius:6px}
.pt:disabled{cursor:default}
.memo{background:#fffbe9;border:2px solid #e6cf86;border-radius:4px 14px 14px 14px;padding:.55rem .8rem;font-size:.9rem;line-height:1.6;position:relative}
.memo::before{content:"🔍 調べてわかったこと";display:block;font-size:.75rem;font-weight:900;color:var(--gold)}
.okbtn{all:unset;box-sizing:border-box;cursor:pointer;position:relative;min-height:56px;border-radius:14px;border:3px solid var(--ai);background:var(--paper);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.05rem;color:var(--ai2);box-shadow:0 4px 0 #1f4f8a55}
.okbtn.ng{border-color:var(--shu);border-style:dashed;opacity:.6;color:var(--shu2);box-shadow:none}
.okbtn.ng::after{content:"✕ ちがう";margin-left:8px;font-size:.8rem}
.okbtn.ok{border-color:var(--ok);background:#eef7f0;color:var(--ok2)}
.okbtn.ok::after{content:"✓ 正解";margin-left:8px;font-size:.8rem}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
@keyframes up{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
@keyframes stamp{0%{transform:scale(1.8) rotate(-12deg);opacity:0}60%{transform:scale(.95) rotate(-8deg);opacity:1}100%{transform:scale(1) rotate(-8deg)}}
.msg{min-height:1.6rem;text-align:center;font-weight:700;font-size:1rem;margin:0}
.msg.bad{color:var(--shu2)}
.verdict{background:var(--paper);border:2px solid var(--ok);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 6px 0 #22263a20;animation:up .35s ease-out;position:relative}
.verdict .hd{display:flex;align-items:center;gap:10px;font-size:1.25rem;font-weight:900;flex-wrap:wrap}
.verdict .stamp{position:absolute;right:12px;top:10px;border:3px solid var(--shu);color:var(--shu);font-weight:900;padding:2px 8px;border-radius:8px;transform:rotate(-8deg);animation:stamp .4s ease-out;background:#fffdf8}
.verdict .stamp.safe{border-color:var(--ai);color:var(--ai)}
.chip{display:inline-block;background:var(--ink);color:#fff;border-radius:8px;padding:1px 8px;font-size:.85rem;font-weight:700}
.verdict .law{font-size:.75rem;color:var(--ink2)}
.verdict p{margin:0;font-size:.95rem;line-height:1.7;text-align:left}
.verdict .fix{background:#eef3fb;border-radius:10px;padding:6px 10px}
.verdict .src{font-size:.75rem}
.hint{background:var(--paper);border:2px solid var(--gold);border-radius:14px;padding:.6rem .9rem;font-size:.95rem;line-height:1.7}
.stars{color:var(--gold);letter-spacing:.08em;font-size:1.15rem}
.stars .off{color:#22263a33}
.dots{display:flex;gap:6px;flex:1;max-width:200px;min-width:0;overflow:hidden}
.dots i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.dots i.on{background:var(--shu);height:12px}.dots i.done{background:var(--ai)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center}
.stats b{display:block;font-size:1.3rem}
.stats small{color:var(--ink2);font-size:.75rem}
.share{background:var(--paper);border-radius:12px;padding:12px;white-space:pre-line;font-size:1rem;line-height:1.6;text-align:center;border:2px solid var(--line)}
.shares{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.shares a,.shares button{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:12px;border:2px solid var(--line);background:var(--paper);color:var(--ink);font-size:.9rem;font-weight:700;text-decoration:none;padding:0 6px;box-sizing:border-box;font-family:inherit;cursor:pointer}
.rlist{display:flex;flex-direction:column;gap:8px}
.rlist div{display:flex;align-items:center;gap:10px;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.88rem;line-height:1.5}
.rlist .w{flex:1;min-width:0}
.rlist .w b{display:block;font-size:.95rem}
.achnext{text-align:center;font-size:.9rem;color:var(--ink2);margin:0}
.achnew{text-align:center;font-size:.95rem;font-weight:700;color:var(--shu2);margin:0;animation:up .35s ease-out}
.badge{background:var(--shu);color:#fff;border-radius:9px;padding:1px 7px;font-size:.75rem}
.lv{display:flex;flex-direction:column;gap:10px}
.book{display:flex;flex-direction:column;gap:8px}
.book button,.book .no{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:2rem 1fr auto;align-items:center;gap:10px;min-height:56px;border-radius:12px;padding:6px 12px;background:var(--paper);border:2px solid var(--line);font-size:.92rem;line-height:1.4}
.book small{display:block;color:var(--ink2);font-size:.75rem}
.book .no{cursor:default;color:var(--ink2);border-style:dashed}
.book .mk{font-size:1.2rem;text-align:center}
.book .ct{font-size:.8rem;color:var(--ink2);white-space:nowrap}
.agrp{font-size:.85rem;color:var(--ink2);margin:4px 0 -6px;font-weight:700;letter-spacing:.1em}
.alist{display:flex;flex-direction:column;gap:8px}
.ach{display:grid;grid-template-columns:1.8rem 1fr auto;grid-template-areas:"ic nm pg" "ic cd cd" "ic br br";align-items:center;gap:3px 10px;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:8px 12px}
.ach .ic{grid-area:ic;font-size:1.2rem;text-align:center}
.ach b{grid-area:nm;font-size:.95rem}.ach small{grid-area:cd;color:var(--ink2);font-size:.8rem;line-height:1.4}
.ach .pg{grid-area:pg;font-size:.8rem;color:var(--ink2);white-space:nowrap}
.ach .bar{grid-area:br;height:6px;border-radius:3px;background:var(--line);overflow:hidden}.ach .bar i{display:block;height:100%;background:var(--ai)}
.ach.got{background:#eef3fb;border-color:var(--ai)}
.ach:not(.got) .ic{filter:grayscale(1);opacity:.5}
.calnav{display:flex;align-items:center;gap:8px}.calnav b{flex:1;text-align:center;font-size:1.05rem}.calnav .sub{flex:0 0 72px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{font-size:.7rem;color:var(--ink2);text-align:center}
.cal .c{all:unset;box-sizing:border-box;min-height:48px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.9rem;background:var(--paper);border:1px solid var(--line);position:relative;line-height:1.1}
.cal .c i{font-style:normal;font-size:.55rem;letter-spacing:-.05em;color:var(--gold)}
.cal .c.p1{background:#eef3fb}.cal .c.p2{background:#d5e1f3}.cal .c.p3{background:var(--ai);color:#fff;border-color:var(--ai2)}.cal .c.p3 i{color:#ffe9a8}
.cal .c.late{background:transparent;border:1.5px dashed var(--ai);color:var(--ai2)}
.cal .c.miss{cursor:pointer;border:2px dotted var(--shu);color:var(--shu2);background:#fff}
.cal .c.miss i{color:var(--shu2)}
.cal .c.today{border:2px solid var(--ink)}
.cal .c .hd{position:absolute;right:2px;top:1px;font-size:.55rem;color:var(--shu2);font-weight:900}
.cal .c.p3 .hd{color:#ffe9a8}
.cal .c.off{visibility:hidden}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;font-size:.75rem;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:4px}.legend em{display:inline-block;width:14px;height:14px;border-radius:4px;font-style:normal}
.about h3{font-size:1rem;margin:.6rem 0 .2rem;color:var(--ai2)}
.about p,.about li{font-size:.92rem;line-height:1.8;text-align:left}
.about ul{padding-left:1.2em;margin:0}
dialog#howto{border:none;border-radius:16px;background:var(--paper);color:var(--ink);max-width:440px;width:calc(100% - 32px);padding:20px;box-sizing:border-box;font-size:1rem}
dialog#howto::backdrop{background:#000000aa}
dialog#howto h2{margin:0 0 10px;letter-spacing:.1em}
dialog#howto ol{padding-left:1.3em;margin:0 0 12px;line-height:1.8}
dialog#howto p{margin:0 0 10px;font-size:.9rem;line-height:1.7;color:var(--ink2)}
dialog#howto a{color:var(--shu2);min-height:44px;display:inline-flex;align-items:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;z-index:9;box-shadow:0 6px 20px #0005;max-width:90%;text-align:center;font-size:1rem}
footer{margin-top:auto;text-align:center;font-size:.8rem;color:var(--ink2);display:flex;gap:4px 14px;justify-content:center;flex-wrap:wrap}
footer a{color:var(--ink2);min-height:44px;display:inline-flex;align-items:center}
/* 色の見分けを助ける：まちがい＝朱・正解＝青に替え、印を大きく */
html.a11y-cvd .pt.ng,html.a11y-cvd .okbtn.ng{border-color:#d55e00}
html.a11y-cvd .pt.ok,html.a11y-cvd .okbtn.ok{border-color:#0072b2;border-width:4px}
html.a11y-cvd .pt.ok::after{background:#0072b2}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* all:unset のボタンでも枠が消えないよう、いちばん最後に強く書く */
:is(.icon,button,a):focus-visible{outline:3px solid var(--shu)!important;outline-offset:2px}
</style>

<script id="a11y-script">
/* 見やすさの設定（色覚・ディスレクシア・弱視・動きに弱い人のため）。外へは何も送らない。
   設定は localStorage の a11y-v1 に置く。同じサイト（satou-aaaaa.github.io）のゲームは同じ設定を使う。
   ゲームの側でできること：
   - 設定を開くボタンに data-a11y-open を付ける（無ければ左下に「Aa」のボタンを出す）
   - 読み上げる文に data-a11y-say を付ける（問題文・知らせなど）
   - 色の見分けを助ける形・模様は html.a11y-cvd の下に CSS で書く。JS では A11y.on('cvd')
   - 揺れ・すべる動きを JS で動かすときは、A11y.on('calm') なら止める
   - 設定が変わると document に a11ychange が届く
   - 設定の印は html の class「a11y-<設定の名前>」（a11y-read など）。部品の class はこれと重ならない名前にする（2026-11-05 a11y-say がボタンとぶつかった） */
(() => {
  const KEY = "a11y-v1";
  const root = document.documentElement;
  const OPTS = [
    ["read", "読みやすい文字", "UD フォント・行間と字間を広く"],
    ["cvd", "色の見分けを助ける", "色に形・模様・記号を足す"],
    ["calm", "動きを減らす", "揺れ・点滅・すべる動きを止める"],
    ["say", "読み上げのボタンを出す", "問題や知らせを声で読む（端末の中の声だけ）"],
    ["ruby", "ふりがなを出す", "むずかしい漢字に読みを付ける"],
  ];
  const media = (q) => { try { return matchMedia(q).matches; } catch { return false; } };
  // 保存した値がオブジェクトでなければ（別のページが書いた・手で直した）無かったことにする（2026-11-05 CodeRabbit：true が入ると設定が開けなくなる）
  const load = () => { try { const v = JSON.parse(localStorage.getItem(KEY) || "{}"); return v && typeof v === "object" && !Array.isArray(v) ? v : {}; } catch { return {}; } };
  let S = load();

  const on = (k) => (k in S ? !!S[k] : k === "calm" ? media("(prefers-reduced-motion: reduce)") : false);
  let fontLoaded = false;
  const loadFont = () => {
    if (fontLoaded) return; fontLoaded = true;
    // Google Fonts を許しているページだけ取りに行く（許していなければ端末にある UD フォントを使う）
    const csp = (document.querySelector('meta[http-equiv="Content-Security-Policy"]') || {}).content || "";
    if (csp && !/fonts\.googleapis\.com/.test(csp)) return;
    const l = document.createElement("link");
    l.rel = "stylesheet"; l.href = "https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap";
    document.head.appendChild(l);
  };
  const apply = () => {
    for (const [k] of OPTS) root.classList.toggle("a11y-" + k, on(k));
    if (on("read")) loadFont();
    if (sayBtn) sayBtn.hidden = !on("say");
    if (!on("say")) stop();
  };
  const set = (k, v) => {
    S = { ...S, ...load() }; // 別のタブで変えた設定を消さないよう、書く前に読み直す
    S[k] = !!v;
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch { /* 保存できなくても今の画面には効かせる */ }
    apply();
    document.dispatchEvent(new CustomEvent("a11ychange", { detail: { key: k, on: !!v } }));
  };

  // 読み上げ：端末の中の日本語の声だけを使う（外へ文字を送る声は使わない）
  const voice = () => { try { return speechSynthesis.getVoices().find((v) => /^ja/i.test(v.lang) && v.localService) || null; } catch { return null; } };
  const stop = () => { try { speechSynthesis.cancel(); } catch { /* 無い端末 */ } };
  const visible = (el) => { const r = el.getBoundingClientRect(); const cs = getComputedStyle(el); return r.width > 0 && r.height > 0 && cs.visibility !== "hidden" && !el.closest("[hidden],[aria-hidden=true],[inert]"); };
  const textOf = (sel) => [...document.querySelectorAll(sel)].filter(visible).map((el) => (el.getAttribute("aria-label") || el.innerText || "").trim()).filter(Boolean).join("。");

  const sayText = () => textOf("[data-a11y-say]") || textOf("h1,h2,[role=status],[aria-live]");

    const v = voice();

    stop();
    const u = new SpeechSynthesisUtterance(text.slice(0, 600));
    u.voice = v; u.lang = v.lang; u.rate = 0.95;
    speechSynthesis.speak(u);
    return true;
  };

  let dlg = null, sayBtn = null, lastFocus = null;
  const build = () => {
    dlg = document.createElement("dialog");
    dlg.className = "a11y-dlg";
    dlg.setAttribute("aria-labelledby", "a11y-h");
    const hasRuby = !!document.querySelector("ruby.a11y-rb");
    dlg.innerHTML = `<h2 id="a11y-h">見やすさ・読みやすさ</h2><p>ほかのゲームにも同じ設定が使われます。文字は2本の指で広げると大きくなります。</p>` +
      OPTS.filter(([k]) => k !== "ruby" || hasRuby).map(([k, n, d]) => `<label><input type="checkbox" data-k="${k}"><span>${n}<small>${d}</small></span></label>`).join("") +
      `<p class="a11y-note" id="a11y-novoice" hidden>この端末には、外へ送らずに読める日本語の声がありません。</p><div class="a11y-row"><button type="button" class="a11y-ok" data-a11y-close>閉じる</button></div>`;
    document.body.appendChild(dlg);
    dlg.addEventListener("change", (e) => {
      const k = e.target.dataset && e.target.dataset.k;
      if (!k) return;
      set(k, e.target.checked);
      if (k === "say") dlg.querySelector("#a11y-novoice").hidden = !(e.target.checked && !voice());
    });
    dlg.querySelector("[data-a11y-close]").addEventListener("click", () => dlg.close());
    dlg.addEventListener("close", () => { if (lastFocus && lastFocus.focus) lastFocus.focus(); });
    sayBtn = document.createElement("button");
    sayBtn.type = "button"; sayBtn.className = "a11y-saybtn"; sayBtn.textContent = "🔊 読む"; sayBtn.setAttribute("aria-label", "画面の問題を読み上げる");
    sayBtn.addEventListener("click", () => {
      try { if (speechSynthesis.speaking) return stop(); } catch { /* 無い端末 */ }
      if (!say(sayText())) open();
    });
    document.body.appendChild(sayBtn);
    if (!document.querySelector("[data-a11y-open]")) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "a11y-btn a11y-float"; b.textContent = "Aa"; b.setAttribute("data-a11y-open", ""); b.setAttribute("aria-label", "見やすさの設定");
      document.body.appendChild(b);
    }
    document.addEventListener("click", (e) => { const t = e.target.closest && e.target.closest("[data-a11y-open]"); if (t) { e.preventDefault(); open(); } });
    apply();
  };
  const open = () => {
    if (!dlg) build();
    lastFocus = document.activeElement;
    for (const c of dlg.querySelectorAll("input[data-k]")) c.checked = on(c.dataset.k);
    dlg.querySelector("#a11y-novoice").hidden = !(on("say") && !voice());
    if (dlg.showModal) dlg.showModal(); else dlg.setAttribute("open", "");
  };
  // 声の一覧はあとから届くことがある。届いたら「声がありません」を出し直す
  try { speechSynthesis.addEventListener("voiceschanged", () => { if (dlg) dlg.querySelector("#a11y-novoice").hidden = !(on("say") && !voice()); }); } catch { /* 無い端末 */ }
  apply();

  window.A11y = { on, set, open, say, stop };
})();
</script>
<!-- a11y:end -->

<script>
"use strict";
const $ = (id) => document.getElementById(id), app = $("app");
const SITE = "https://satou-aaaaa.github.io/kokoku-minuki/";
const FEEDBACK = "https://github.com/satou-aaaaa/kokoku-minuki/issues/new?template=feedback.yml";
const KEY = "kokoku-v1", EPOCH = "2026-11-07";
const G = window.KOKOKU, LV = G.LV;

// ---- 日付（日本時間。だれでも同じ5枚）----
const jstNow = () => new Date(Date.now() + 9 * 3600e3);
const todayKey = () => jstNow().toISOString().slice(0, 10);
const dayNo = (k) => Math.round((Date.parse(k) - Date.parse(EPOCH)) / 864e5) + 1;
const prevDay = (k) => new Date(Date.parse(k) - 864e5).toISOString().slice(0, 10);
const md = (k) => `${+k.slice(5, 7)}/${+k.slice(8, 10)}`;
const listOf = (mode, date) => (mode === "h" ? G.hardTags(date) : G.dailyTags(date));

// 見抜くコツ：消費者庁の資料の要点を、日ごとに1つ
const TIPS = [
  ["大きな字と※を比べる", "大きな字の言うことを、※の小さな字が打ち消していないか見ましょう。"],
  ["「No.1」はだれに聞いた？", "使った人に聞いたか。主な商品と比べたか。※に書いてあります。"],
  ["「通常価格」は本当？", "比べる値段で、セールの前にしばらく売っていたかが大事です。"],
  ["頼まれた投稿か", "会社が頼んだ投稿は「広告」「PR」とはっきり書く決まりです。"],
  ["試験の場所と広さ", "小さな箱の中の試験で、部屋全体に効くとは言えません。"],
  ["「今日まで」は本当？", "明日も同じ値段なら、「今日まで」はウソになります。"],
  ["「個人の感想です」", "そう書いても、だれでも効くように見せれば問題になりえます。"],
];
const tipOf = (k) => TIPS[((dayNo(k) - 1) % TIPS.length + TIPS.length) % TIPS.length];

// ---- とことん：やさしい6 → ふつう10 → ふつう・むずかしい30 を毎回ちがう種で。使い切る前に30枚ずつ足す。1回の中で同じ広告は出さない ----
const ERAMP = [[[0], 6], [[1], 10], [[1, 2], 30]], EMORE = 30;
const rid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
function randomTags(lvs, n, salt, used) {
  const ids = lvs.flatMap((l) => G.kindsOf(l)), out = []; let prev = null, i = 0;
  while (out.length < n && i < n * 20) {
    const id = ids[Math.floor(Math.random() * ids.length)], tag = `${id}|${salt}:${i++}`, k = G.keyOf(tag);
    if ((ids.length > 1 && id === prev) || used.has(k)) continue;
    used.add(k); prev = id; out.push(tag);
  }
  return out;
}
function endlessList() { const s = rid(), used = new Set(), out = []; ERAMP.forEach(([lvs, n], j) => out.push(...randomTags(lvs, n, s + ":" + j, used))); return out; }
function moreList(list) { const used = new Set(list.map(G.keyOf)); return randomTags([1, 2], EMORE, rid(), used); }
const starsOf = (m) => (m === 0 ? 3 : m === 1 ? 2 : 1); // m = まちがい＋ヒントの数
const starStr = (s) => `<span class="stars" aria-label="星${s}つ">${"★".repeat(s)}<span class="off">${"☆".repeat(3 - s)}</span></span>`;

// ---- 記録（この端末の localStorage だけ）----
// days/hdays/adays：日付 → { m:[1枚ごとのまちがい＋ヒント], k:[種類] }。adays はあとから（連続の日・今日の記録・Ko-fi には数えない）
// dex：種類 → 見抜いた数（見抜き帳）。okc：「問題なし」を一度で見分けた数。runs：モードごとの途中経過
const fresh = () => ({ v: 1, days: {}, hdays: {}, adays: {}, dex: {}, okc: 0, runs: {}, tut: false, kofi: {}, ach: {}, ebest: 0, edone: {} });
let MODE = "d";
let mem = null; // 保存できない環境では、開いているあいだだけここに置く
const doneOf = (r) => !!r && r.mode !== "e" && r.res.length >= r.list.length, recOf = (r) => ({ m: r.res.map((x) => x.m), k: r.list.map((t) => t.split("|")[0]) });
const runKey = (mode, date) => (mode === "a" ? "a:" + date : mode);
const bookOf = (s, m) => (m === "d" ? s.days : m === "h" ? s.hdays : m === "a" ? s.adays : null);
const OBJS = ["days", "hdays", "adays", "dex", "runs", "kofi", "ach", "edone"];
// 終わった回を日ごとの記録に入れる（結果を見る前に閉じても、別のタブが次の日を保存しても、終えた日を失わない）
function bank(s, r) { const b = doneOf(r) ? bookOf(s, r.mode) : null; if (!b || b[r.date] || (r.mode === "a" && s.days[r.date])) return false; b[r.date] = recOf(r); return true; }
// 保存に失敗したあとはメモリと保存の両方を読む。合わせる前に両方を fresh() で補う。数は高いほう、途中経過は同じ回なら進んだほう
function load() {
  let a = null, b = null;
  try { b = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  try { a = mem !== null ? JSON.parse(mem) : null; } catch (e) {}
  if (!a || typeof a !== "object" || a.v !== 1) a = null; if (!b || typeof b !== "object" || b.v !== 1) b = null;
  if (!a || !b) return tidy(Object.assign(fresh(), a || b || {}));
  a = Object.assign(fresh(), a); b = Object.assign(fresh(), b);
  const [n, o] = (a.t || 0) >= (b.t || 0) ? [a, b] : [b, a], s = Object.assign(fresh(), n);
  for (const k in o) {
    if (k === "runs" || k === "t") continue;
    const x = o[k], y = n[k];
    if (x && y && typeof x === "object" && typeof y === "object") { s[k] = Object.assign({}, x, y); for (const q in x) if (typeof x[q] === "number" && typeof y[q] === "number") s[k][q] = Math.max(x[q], y[q]); }
    else if (typeof x === "number" && typeof y === "number") s[k] = Math.max(x, y);
    else if (x === true) s[k] = true;
  }
  const ra = a.runs || {}, rb = b.runs || {}, prog = (r) => (r.res ? r.res.length : 0) * 1000 + (r.cur ? (r.cur.wrong || []).length * 10 + (r.cur.hints || 0) : 0);
  s.runs = Object.assign({}, n.runs);
  for (const m of new Set([...Object.keys(ra), ...Object.keys(rb)])) {
    const x = ra[m], y = rb[m];
    if (x === undefined || y === undefined) { if (x || y) s.runs[m] = x || y; continue; }
    if (!x || !y) { const r = x || y; if (!r || bank(s, r) || doneOf(r)) continue; const bd = bookOf(s, r.mode); if (!bd || !bd[r.date]) s.runs[m] = r; continue; }
    if (x.id !== y.id && x.date !== y.date) { const [w, l] = x.date > y.date ? [x, y] : [y, x]; bank(s, l); s.runs[m] = w; }
    else if (x.id === y.id) { const px = prog(x), py = prog(y); s.runs[m] = px > py ? x : py > px ? y : n.runs[m]; }
  }
  return tidy(s);
}
// 引き継ぎコードなどから入った値を正しい形に直す（数の所に文字が入っていても画面に出さない）
const num = (v) => (Number.isFinite(+v) && +v >= 0 ? Math.floor(+v) : 0);
function tidy(s) {
  s.ebest = num(s.ebest); s.okc = num(s.okc);
  for (const q of OBJS) if (!s[q] || typeof s[q] !== "object" || Array.isArray(s[q])) s[q] = {};
  for (const k in s.dex) s.dex[k] = num(s.dex[k]);
  const okDate = (v) => { if (typeof v !== "string" || !/^\d{4}-\d\d-\d\d$/.test(v)) return false; const t = Date.parse(v + "T00:00:00Z"); return Number.isFinite(t) && new Date(t).toISOString().slice(0, 10) === v; };
  const okTag = (t) => typeof t === "string" && Object.prototype.hasOwnProperty.call(G.BY, t.split("|")[0]);
  const okRec = (x) => !!x && typeof x === "object" && Array.isArray(x.m) && x.m.every((v) => Number.isInteger(v) && v >= 0);
  for (const b of [s.days, s.hdays, s.adays]) for (const d in b) if (!okDate(d) || !okRec(b[d])) delete b[d];
  const ed = Object.entries(s.edone).filter(([, t]) => Number.isFinite(+t)).sort((x, y) => y[1] - x[1]).slice(0, 20); s.edone = Object.fromEntries(ed.map(([i, t]) => [i, +t])); // 終えたとことんの回（新しい20件）
  const MODES = ["d", "h", "p", "e", "a"];
  for (const m in s.runs) {
    const r = s.runs[m]; if (r === null) continue;
    if (!r || typeof r !== "object" || !MODES.includes(r.mode) || (r.mode === "a" ? m !== "a:" + r.date : m !== r.mode) || (r.mode === "e" && s.edone[r.id])) { delete s.runs[m]; continue; } // 知らないモード・終えたとことんは戻さない
    if (typeof r !== "object" || !okDate(r.date) || !Array.isArray(r.list) || !r.list.every(okTag) || !Array.isArray(r.res) || !r.res.every((x) => x && typeof x === "object" && Number.isInteger(x.m) && x.m >= 0)) { delete s.runs[m]; continue; }
    if (r.cur != null && (typeof r.cur !== "object" || !Array.isArray(r.cur.wrong))) r.cur = null; else if (r.cur) { r.cur.hints = num(r.cur.hints); r.cur.wrong = r.cur.wrong.filter((w) => Number.isInteger(w)); }
  }
  return s;
}
// 保存の前に読み直す（別のタブで進めた記録を消さない）
function save(fn) { const s = load(); fn(s); s.t = Math.max(Date.now(), (s.t || 0) + 1); const j = JSON.stringify(s); try { localStorage.setItem(KEY, j); mem = null; } catch (e) { mem = j; } return s; }
function streak(days) { let k = todayKey(), n = 0; if (!days[k]) k = prevDay(k); while (days[k]) { n++; k = prevDay(k); } return n; }
const playedDays = (s) => new Set([...Object.keys(s.days), ...Object.keys(s.adays)]).size;
const solvedAll = (s) => Object.values(s.dex).reduce((a, b) => a + (+b || 0), 0);
// 取りこぼした日：今日より前の7日のうち、今日の5枚もあとからも遊んでいない日（新しい順。第1回より前は無い）
const LATE = 7;
function lateDays(s, k = todayKey()) { const out = []; let d = k; for (let i = 0; i < LATE; i++) { d = prevDay(d); if (d < EPOCH) break; if (!s.days[d] && !s.adays[d]) out.push(d); } return out; }

// ---- 実績：いまの記録から毎回数える（新しく残すのは結果で知らせ終えた印 ach だけ）。[id, 名前, 条件, 種類, 数え方, 目標] ----
function tally(s) {
  const dk = Object.values(s.days);
  return { days: Object.keys(s.days).length, played: playedDays(s), clean: dk.filter((r) => r.m.length && r.m.every((m) => m === 0)).length, hard: Object.keys(s.hdays).length,
    late: Object.keys(s.adays).length, kinds: Object.keys(s.dex).filter((k) => G.BY[k] && s.dex[k] > 0).length, solved: solvedAll(s), ebest: s.ebest || 0, okc: s.okc || 0 };
}
const ACH = [
  ["clean1", "ひと目で見抜く", "今日の5枚を、まちがいもヒントもなしで調べる", 0, "clean", 1],
  ["clean5", "調べる目", "まちがいなしの日を5日", 0, "clean", 5],

const AGRP = ["腕前", "集める", "続ける"];
const AUNIT = { clean: "日", hard: "日", days: "日", played: "日", late: "日", kinds: "種類", solved: "枚", ebest: "枚", okc: "枚" };
const achGot = (s) => { const t = tally(s); return ACH.filter((a) => t[a[4]] >= a[5]).map((a) => a[0]); };
// あと少しの実績：まだの実績のうち、いちばん目標に近いもの1つ（ゴールに近いほど人はがんばる。Kivetz ほか 2006）
function nextAch(s) {
  const t = tally(s); let best = null;
  for (const a of ACH) { const n = t[a[4]]; if (n <= 0 || n >= a[5]) continue; const r = n / a[5], left = a[5] - n; if (!best || r > best.r || (r === best.r && left < best.left)) best = { id: a[0], name: a[1], left, unit: AUNIT[a[4]] || "", r }; }
  return best;
}

const esc = (t) => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
function partHtml(P, x, j) {

  const say = x.t === "img" ? `商品の絵：${x.text}` : x.text;
  return `<button class="pt p-${x.t}" data-j="${j}" aria-label="${esc(say)}">${inner}</button>`;
}
function adHtml(P) {
  const parts = P.parts.map((x, j) => partHtml(P, x, j)).join("");
  if (P.layout === "sns") return `<div class="ad sns" id="ad" data-a11y-say><div class="band" style="background:${P.color}"><span>SNS の投稿</span><i>架空</i></div><div class="body">${parts}</div><div class="likes" aria-hidden="true">♡ ${100 + (G.seedOf(P.tag) % 900)}</div></div>`;
  return `<div class="ad" id="ad" data-a11y-say><div class="band" style="background:${P.color}"><span>${esc(P.shop)}</span><i>広告・架空</i></div><div class="body">${parts}</div></div>`;
}

function startRun(mode, opt) {
  const k = todayKey(); let ng = false;
  save((s) => {
    // あとから：取りこぼした日（過去7日・まだ遊んでいない）だけ。その日の今日の5枚と同じ広告。途中経過は日付ごとに runs["a:日付"]
    if (mode === "a") {
      const ra = s.runs[runKey("a", opt)];
      if (!lateDays(s, k).includes(opt)) { ng = true; return; } // 期限は続きからより先に確かめる
      if (ra && ra.date === opt && !doneOf(ra)) return;
      s.runs[runKey("a", opt)] = { mode, date: opt, list: G.dailyTags(opt), res: [], cur: null, id: "a" + opt, a0: achGot(s) };
      return;
    }
    if (mode === "e") { if (s.runs.e) return; s.runs.e = { mode, date: k, list: endlessList(), res: [], cur: null, id: rid(), a0: achGot(s) }; return; }
    if (mode !== "p" && s.runs[mode] && s.runs[mode].date === k) return; // 続きから
    if ((mode === "d" && s.days[k]) || (mode === "h" && s.hdays[k])) return; // 別のタブで今日の分を終えていたら、もう一度は始めない
    let list;
    if (mode === "d" || mode === "h") list = listOf(mode, k);
    else if (typeof opt === "string") { const r = rid(), used = new Set(); list = []; for (let i = 0; list.length < 5 && i < 100; i++) { const t = `${opt}|${r}:${i}`, kk = G.keyOf(t); if (!used.has(kk)) { used.add(kk); list.push(t); } } }
    else list = randomTags([opt], 5, rid(), new Set());
    if (s.runs[mode]) bank(s, s.runs[mode]); // 前の日に終えたまま結果を見ていない回も記録してから替える
    s.runs[mode] = { mode, date: k, list, res: [], cur: null, id: rid(), a0: achGot(s) };
  });
  if (ng) return cal();
  MODE = runKey(mode, opt);
  play();
}

// 今の1枚：{ i, date, id, tag, P(広告), wrong:[選んだまちがいの番号], hints, done }。番号 j は部品の番号、「問題なし」は -1
let cur = null;
const same = (r) => r && cur && r.date === cur.date && r.id === cur.id && r.res.length === cur.i && r.list[cur.i] === cur.tag; // 保存した進み具合が、この画面と同じ広告か
// 途中の保存：別のタブで使ったヒント・まちがいも減らさない（多いほう・合わせたほうを残す）
function keep() { save((s) => { const r = s.runs[MODE]; if (!same(r)) return; const was = r.cur && r.cur.i === cur.i && r.cur.tag === cur.tag ? r.cur : { wrong: [], hints: 0 }; cur.hints = Math.max(cur.hints, was.hints || 0); for (const w of was.wrong || []) if (!cur.wrong.includes(w)) cur.wrong.push(w); r.cur = { i: cur.i, tag: cur.tag, wrong: cur.wrong.slice(), hints: cur.hints }; }); }
const missOf = () => cur.wrong.length + cur.hints;
const choicesOf = (P) => [...P.parts.map((_, j) => j), -1];
function play() {
  const s = load(), run = s.runs[MODE];
  if (!run) return home();
  const i = run.res.length;
  if (run.mode === "e" && i >= run.list.length - 3) { save((s2) => { const r = s2.runs.e; if (r && r.id === run.id) r.list = r.list.concat(moreList(r.list)); }); return play(); } // とことんは終わらない
  if (i >= run.list.length) return finish();
  if (run.mode === "a" && s.days[run.date]) { save((s2) => { s2.runs[MODE] = null; }); toast("この日は別の画面で遊び終えています"); return home(); }
  const tag = run.list[i], P = G.make(tag), hard = run.mode === "h";
  const saved = run.cur && run.cur.i === i && run.cur.tag === tag ? run.cur : { wrong: [], hints: 0 };
  cur = { i, date: run.date, id: run.id, tag, P, wrong: (saved.wrong || []).filter((w) => w !== P.ans && choicesOf(P).includes(w)), hints: saved.hints || 0, done: false };
  const label = run.mode === "d" ? LV[P.lv] : run.mode === "a" ? `あとから・${LV[P.lv]}` : hard ? "上級" : run.mode === "e" ? `とことん・${LV[P.lv]}` : `練習・${LV[P.lv]}`;
  const showTip = (run.mode === "d" || run.mode === "a") && i === 0, tip = tipOf(run.date), clean = run.res.filter((x) => x.m === 0).length;
  app.innerHTML = `
    <header><button class="icon" id="back" aria-label="もどる">←</button>
      ${run.mode === "e" ? `<span style="font-size:.85rem;color:var(--ink2);flex:1">${label}　${i + 1}枚目・一度で見抜いた ${clean}枚${s.ebest ? `（ベスト ${s.ebest}）` : ""}</span>`
        : `<div class="dots" aria-label="${i + 1}枚目／${run.list.length}枚">${run.list.map((_, j) => `<i class="${j < i ? "done" : j === i ? "on" : ""}"></i>`).join("")}</div><span style="font-size:.8rem;color:var(--ink2)">${label} ${i + 1}/${run.list.length}</span>`}
    </header>
    ${showTip ? `<div class="tip"><b>今日のコツ：${tip[0]}</b><br>${tip[1]}</div>` : ""}
    <p class="q" data-a11y-say>ウソ・言いすぎの所はどこ？</p>
    ${adHtml(P)}
    ${P.memo ? `<div class="memo" id="memo" data-a11y-say>${esc(P.memo)}</div>` : ""}
    <button class="okbtn" id="okbtn" data-j="-1">問題なし（ウソは無い）</button>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
    <div id="hintbox"></div>
    ${hard ? "" : `<button class="sub" id="hint">ヒント</button>`}
    ${run.mode === "e" ? `<button class="sub" id="quit">ここで降りる（${i}枚で終える）</button>` : ""}
    <div id="after"></div>`;
  $("back").onclick = home;
  document.querySelectorAll(".pt,.okbtn").forEach((b) => (b.onclick = () => choose(+b.dataset.j)));
  if ($("hint")) $("hint").onclick = hint;
  if ($("quit")) $("quit").onclick = () => { if (cur && cur.done) return; finish(); };
  paint();
  toTop();
}
const btnOf = (j) => (j === -1 ? $("okbtn") : document.querySelector(`.pt[data-j="${j}"]`));
// ヒント2：まちがいの選び肢を消して、2つまでにしぼる（残すのは正解と、番号の順で最後のまちがい1つ）
const cutOf = () => { if (cur.hints < 2) return []; const left = choicesOf(cur.P).filter((j) => j !== cur.P.ans && !cur.wrong.includes(j)); return left.slice(0, Math.max(0, left.length - 1)); };
function paint() {
  const cut = cutOf();
  for (const j of choicesOf(cur.P)) { const b = btnOf(j); if (!b) continue; const ng = cur.wrong.includes(j) || cut.includes(j); b.classList.toggle("ng", ng); b.disabled = ng || cur.done; if (ng && !/（ちがう）$/.test(b.getAttribute("aria-label") || "")) b.setAttribute("aria-label", (j === -1 ? "問題なし" : b.getAttribute("aria-label")) + "（ちがう）"); }
  const h = $("hint"); if (h) h.disabled = cur.done || cur.hints >= 2;
  $("hintbox").innerHTML = cur.hints && !cur.done ? `<div class="hint" role="status">💡 ${esc(cur.P.look)}${cur.hints >= 2 ? "<br>💡 ちがう所を消しました。のこりは2つです。" : ""}</div>` : "";
}
function hint() { if (cur.done || cur.hints >= 2) return; cur.hints++; keep(); paint(); }
function choose(j) {
  if (cur.done) return;
  if (!same(load().runs[MODE])) { toast("別の画面で先に進んでいます"); return play(); }
  const P = cur.P;
  if (j !== P.ans) {
    if (cur.wrong.includes(j)) return;
    buzz(40);
    cur.wrong.push(j); keep(); paint();
    $("msg").className = "msg bad"; $("msg").textContent = j === -1 ? "✕ この広告には、ウソ・言いすぎがあります。" : "✕ そこは問題ありません。もう一度どうぞ。";
    return;
  }
  // 正解
  cur.done = true; buzz([10, 40, 10]);
  let m = missOf();
  const s = save((s) => { const r = s.runs[MODE]; if (!same(r)) return;
    const was = r.cur && r.cur.i === cur.i && r.cur.tag === cur.tag ? r.cur : null; // 別のタブで使ったヒント・まちがいも数える
    if (was) { cur.hints = Math.max(cur.hints, num(was.hints)); for (const w of was.wrong || []) if (Number.isInteger(w) && !cur.wrong.includes(w)) cur.wrong.push(w); m = missOf(); }
    r.res.push({ m }); r.cur = null; s.dex[P.kind] = (s.dex[P.kind] || 0) + 1; if (P.ok && m === 0) s.okc = (s.okc || 0) + 1; });
  const st = starsOf(m), r = s.runs[MODE], fin = r && r.mode !== "e" && r.res.length >= r.list.length;
  btnOf(P.ans).classList.add("ok");
  for (const jj of choicesOf(P)) btnOf(jj).disabled = true;
  if ($("hint")) $("hint").disabled = true; if ($("quit")) $("quit").hidden = true;
  $("hintbox").innerHTML = ""; $("msg").className = "msg"; $("msg").textContent = "";
  const R = G.RULES[P.rule], src = G.SRC[P.src];
  $("after").innerHTML = `<div class="verdict" role="status" data-a11y-say>
    <span class="stamp${P.ok ? " safe" : ""}" aria-hidden="true">${P.ok ? "問題なし" : "見抜いた"}</span>
    <div class="hd">✓ ${P.ok ? "正解！" : "見抜いた！"} ${starStr(st)}</div>
    <div>${P.ok ? `<span class="chip">問題なし</span>` : `<span class="chip">${R.name}</span> <span class="law">${R.law}</span>`}</div>
    <p><b>${esc(P.name)}：</b>${esc(P.why)}</p>
    ${P.ok ? "" : `<p class="fix">こうすれば OK：${esc(P.fix)}</p>`}
    <p class="src">出典：<a href="${src[1]}" target="_blank" rel="noopener">消費者庁「${src[0]}」</a></p>
    <button class="main ok" id="next">${fin ? "結果を見る" : "次の広告へ"}</button></div>`;
  $("next").onclick = play;
  setTimeout(() => { if ($("next") && cur && cur.done && cur.tag === P.tag) $("next").scrollIntoView({ behavior: window.A11y && A11y.on("calm") ? "auto" : "smooth", block: "nearest" }); }, 60);
}

function finish() {
  const s = load(), run = s.runs[MODE];
  if (!run) return home();
  if (run.mode === "e") return endFinish(run);
  let first = false, newAch = [];
  const rec = recOf(run);
  save((s2) => {
    first = bank(s2, run);
    const c = s2.runs[MODE]; if (c && c.date === run.date && c.id === run.id) s2.runs[MODE] = null; // 別のタブで新しい回が始まっていたら、それは消さない
    if (Array.isArray(run.a0)) newAch = achGot(s2).filter((id) => !run.a0.includes(id) && !s2.ach[id]);
    for (const id of newAch) s2.ach[id] = 1;
  });
  if (run.mode === "p") return result("p", run.date, false, { list: run.list, ...rec }, newAch);
  result(run.mode, run.date, first, null, newAch);
}
// とことんの終わり：一度で見抜いた数を自己ベストと比べる（他の人との順位は出さない）
function endFinish(run) {
  const n = run.res.filter((x) => x.m === 0).length, all = run.res.length, miss = run.res.reduce((a, x) => a + x.m, 0); let prev = 0, newAch = [];
  save((s2) => { prev = s2.ebest || 0; s2.ebest = Math.max(prev, n); const c = s2.runs.e; if (c && c.id === run.id) s2.runs.e = null; s2.edone[run.id] = Date.now(); if (Array.isArray(run.a0)) newAch = achGot(s2).filter((id) => !run.a0.includes(id) && !s2.ach[id]); for (const id of newAch) s2.ach[id] = 1; });
  const s = load(), best = n > prev && n > 0;
  app.innerHTML = `
    <header><button class="icon" id="back" aria-label="ホームへ">←</button><h1>広告みぬき<small>とことん</small></h1></header>
    <p class="big" id="eres">${all}枚 調べました</p>
    <p class="note" id="ebest">一度で見抜いた ${n}枚・まちがい＋ヒント ${miss}回<br>${best ? "🎉 自己ベスト更新！" : `自己ベスト ${s.ebest}枚`}</p>
    ${newAch.length ? `<p class="achnew" id="achnew">${newAch.map((id) => `🏅 実績：${ACH.find((a) => a[0] === id)[1]}`).join("<br>")}</p>` : ""}
    <button class="main" id="go-e">もう一度とことん</button>
    <div class="row"><button class="sub" id="go-p">練習する</button><button class="sub" id="go-dex">見抜き帳を見る</button></div>
    <p class="note"><a href="${FEEDBACK}" target="_blank" rel="noopener">感想を送る</a></p>`;
  $("back").onclick = home; $("go-e").onclick = () => startRun("e"); $("go-p").onclick = practiceMenu; $("go-dex").onclick = book;
  toTop();
}
// 共有の文：広告の中身・答えは出さない。まちがい＋ヒントの数で色と形を変える（色だけで分けない）
const sq = (m) => (m === 0 ? "🟢" : m === 1 ? "🔶" : "🔺");
function shareText(mode, k, rec) { return `広告みぬき${mode === "h" ? " 上級" : ""} 第${dayNo(k)}回 ${md(k)}\n${rec.m.map(sq).join("")}${rec.m.every((m) => m === 0) ? " まちがいなし" : ""}`; }
function untilNext() { const n = jstNow(), ms = 864e5 - (n.getTime() % 864e5); return `${Math.floor(ms / 36e5)}時間${Math.floor((ms % 36e5) / 6e4)}分`; }
function result(mode, k, first, prec, newAch = []) {
  const s = load(), rec = mode === "p" ? prec : bookOf(s, mode)[k];
  if (!rec) return home();
  const list = mode === "p" ? prec.list : listOf(mode, k), total = rec.m.reduce((a, b) => a + b, 0), late = mode === "a", text = shareText(mode, k, rec);
  const showKofi = first && mode !== "p" && !late && total === 0 && !s.kofi[k + mode]; // あとから・練習・まちがいのある日には出さない
  if (showKofi) save((s2) => { s2.kofi[k + mode] = 1; });
  app.innerHTML = `
    <header><button class="icon" id="back" aria-label="ホームへ">←</button><h1>広告みぬき<small>${mode === "d" ? `今日の5枚 第${dayNo(k)}回` : late ? `第${dayNo(k)}回 あとから` : mode === "h" ? "上級" : "練習"}</small></h1></header>
    <p class="big">${total === 0 ? "全部まちがいなし！" : `${list.length}枚 調べました`}</p>
    ${newAch.length ? `<p class="achnew" id="achnew">${newAch.map((id) => `🏅 実績：${ACH.find((a) => a[0] === id)[1]}`).join("<br>")}</p>` : ""}
    ${(() => { const nx = nextAch(s); return nx ? `<p class="achnext" id="achnext">🎯 あと${nx.left}${nx.unit}で「${nx.name}」</p>` : ""; })()}
    <p class="note">今日わかった決まり</p>
    <div class="rlist">${list.map((tag, j) => { const P = G.make(tag); return `<div><span>${starStr(starsOf(rec.m[j]))}</span><span class="w"><b>${P.ok ? "問題なし：" : ""}${esc(P.name)}</b>${esc(P.ok ? P.why : P.fix)}</span></div>`; }).join("")}</div>
    ${late ? `<p class="note">あとから遊んだ日は、カレンダーに ↺ で残ります（続けた日には数えません）。</p><button class="main alt" id="go-cal">カレンダーへ</button>` : ""}
    ${mode !== "p" && !late ? `<div class="share">${esc(text)}</div>
    <button class="main" id="share">結果をシェア</button>
    <div class="shares"><a id="toX" target="_blank" rel="noopener">Xで投稿</a><a id="toLine" target="_blank" rel="noopener">LINEで送る</a><button id="copy">コピー</button></div>
    <p class="note">🟢まちがいなし　🔶1回　🔺2回以上<br>次の5枚まで あと <b>${untilNext()}</b></p>` : ""}
    ${mode !== "p" ? `<button class="main alt" id="go-e">続けて遊ぶ：とことん${s.ebest ? `（ベスト ${s.ebest}枚）` : ""}</button>` : ""}
    ${mode === "d" && k === todayKey() && !s.hdays[k] ? `<button class="main alt" id="go-h">上級：むずかしい3枚に挑む</button>` : ""}
    <div class="row"><button class="sub" id="go-p">練習する</button><button class="sub" id="go-dex">見抜き帳を見る</button></div>
    ${showKofi ? `<p class="note kofi">楽しめたら、<a href="https://ko-fi.com/satouaaaaa" target="_blank" rel="noopener">Ko-fi でコーヒー1杯の応援</a>をもらえると、新しいゲームづくりの励みになります（任意・遊ぶのはずっと無料）。</p>` : ""}
    <p class="note"><a href="${FEEDBACK}" target="_blank" rel="noopener">感想を送る</a></p>`;
  $("back").onclick = home; $("go-p").onclick = practiceMenu; $("go-dex").onclick = book;
  if ($("go-e")) $("go-e").onclick = () => startRun("e");
  if ($("go-h")) $("go-h").onclick = () => (k === todayKey() ? startRun("h") : home());
  if ($("go-cal")) $("go-cal").onclick = () => cal(k.slice(0, 7));
  if (mode !== "p" && !late) {
    const withUrl = text + "\n" + SITE;
    $("toX").href = "https://twitter.com/intent/tweet?text=" + encodeURIComponent(withUrl);
    $("toLine").href = "https://line.me/R/share?text=" + encodeURIComponent(withUrl);
    const copy = (t) => { (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast("コピーしました"), () => toast("コピーできませんでした")); };
    $("copy").onclick = () => copy(withUrl);
    $("share").onclick = () => { if (navigator.share) navigator.share({ text: withUrl }).catch(() => {}); else copy(withUrl); };
  }
  toTop();
}

// 見抜き帳：見抜いた決まりと数。押すと、その決まりだけで練習
function book() {
  const s = load(), n = G.KINDS.filter((k) => s.dex[k.id] > 0).length;
  app.innerHTML = `
    <header><button class="icon" id="back" aria-label="ホームへ">←</button><h1>見抜き帳<small>${n}/${G.KINDS.length}種類</small></h1></header>
    <p class="note">調べた決まりが集まります。押すと、その決まりだけで5枚練習できます。</p>
    ${Object.keys(G.RULES).map((ru) => `<p class="agrp">${G.RULES[ru].name}</p><div class="book">${G.KINDS.filter((k) => k.rule === ru).map((k) => s.dex[k.id] > 0 ? `<button data-k="${k.id}"><span class="mk" aria-hidden="true">🔍</span><span>${esc(k.name)}<small>${LV[k.lv]}</small></span><span class="ct">${s.dex[k.id]}枚</span></button>` : `<span class="no" role="img" aria-label="まだ見つけていない決まり（${LV[k.lv]}）"><span class="mk" aria-hidden="true">？</span><span>まだ<small>${LV[k.lv]}</small></span><span class="ct"></span></span>`).join("")}</div>`).join("")}
    ${footer()}`;
  $("back").onclick = home;
  document.querySelectorAll(".book button").forEach((b) => (b.onclick = () => startRun("p", b.dataset.k)));
  bindFooter(); toTop();
}
function achView() {
  const s = load(), t = tally(s), got = achGot(s);
  app.innerHTML = `
    <header><button class="icon" id="back" aria-label="ホームへ">←</button><h1>実績<small>${got.length}/${ACH.length}</small></h1></header>
    ${AGRP.map((g, gi) => `<p class="agrp">${g}</p><div class="alist">${ACH.filter((a) => a[3] === gi).map((a) => { const ok = got.includes(a[0]), n = Math.min(t[a[4]], a[5]); return `<div class="ach${ok ? " got" : ""}" data-id="${a[0]}"><span class="ic" aria-hidden="true">🏅</span><b>${ok ? "✓ " : ""}${a[1]}</b><span class="pg">${ok ? "達成" : `${n}/${a[5]}`}</span><small>${a[2]}</small>${ok ? "" : `<span class="bar"><i style="width:${Math.round((n / a[5]) * 100)}%"></i></span>`}</div>`; }).join("")}</div>`).join("")}
    ${footer()}`;
  $("back").onclick = home; bindFooter(); toTop();
}
// 遊んだ日のカレンダー：今日の5枚の日は★（まちがいの少なさ）、あとから遊んだ日は ↺、取りこぼした過去7日は押すとあとから遊べる
const ymOf = (k) => k.slice(0, 7);
const ymAdd = (ym, n) => { const d = new Date(Date.UTC(+ym.slice(0, 4), +ym.slice(5, 7) - 1 + n, 1)); return d.toISOString().slice(0, 7); };
const lvOf = (rec) => { const t = rec && Array.isArray(rec.m) ? rec.m.reduce((a, b) => a + b, 0) : 9; return t === 0 ? 3 : t <= 2 ? 2 : 1; };
function cal(ym) {
  const s = load(), k = todayKey(), late = lateDays(s, k), st = streak(s.days);
  if (!ym || ym > ymOf(k)) ym = ymOf(k);
  if (ym < ymOf(EPOCH)) ym = ymOf(EPOCH);
  const y = +ym.slice(0, 4), m = +ym.slice(5, 7), dow = new Date(Date.UTC(y, m - 1, 1)).getUTCDay(), n = new Date(Date.UTC(y, m, 0)).getUTCDate(), cells = [];
  for (let i = 0; i < dow; i++) cells.push(`<span class="c off"></span>`);
  for (let d = 1; d <= n; d++) {
    const key = `${ym}-${String(d).padStart(2, "0")}`, rec = s.days[key], ar = s.adays[key], hd = s.hdays[key] ? `<span class="hd">上</span>` : "";
    if (rec) { const lv = lvOf(rec); cells.push(`<span class="c p${lv}" data-k="${key}" role="img" aria-label="${m}月${d}日 星${lv}つ${hd ? "・上級" : ""}">${d}<i>${"★".repeat(lv)}</i>${hd}</span>`); }
    else if (ar) cells.push(`<span class="c late" data-k="${key}" role="img" aria-label="${m}月${d}日 あとから遊んだ">${d}<i>↺</i></span>`);
    else if (late.includes(key)) { const go = s.runs[runKey("a", key)]; cells.push(`<button class="c miss" data-k="${key}" aria-label="${m}月${d}日をあとから遊ぶ${go ? "（続きから）" : ""}">${d}<i>${go ? "続き" : "▶"}</i></button>`); }
    else cells.push(`<span class="c${key === k ? " today" : ""}" data-k="${key}">${d}</span>`);
  }
  const pd = playedDays(s);
  app.innerHTML = `<header><button class="icon" id="back" aria-label="ホームへ">←</button><h1>カレンダー${pd ? `<small>合わせて ${pd}日${st >= 1 ? `・続けて ${st}日` : ""}</small>` : ""}</h1></header>
    <div class="calnav"><button class="sub" id="prev" aria-label="前の月"${ym <= ymOf(EPOCH) ? " disabled" : ""}>‹</button><b>${y}年${m}月</b><button class="sub" id="next" aria-label="次の月"${ym >= ymOf(k) ? " disabled" : ""}>›</button></div>
    <div class="cal">${["日", "月", "火", "水", "木", "金", "土"].map((w) => `<span class="wd">${w}</span>`).join("")}${cells.join("")}</div>
    <div class="legend"><span><em style="background:var(--ai)"></em>★★★ まちがいなし</span><span><em style="background:#d5e1f3"></em>★★ 1〜2回</span><span>↺ あとから</span><span>上 上級</span></div>
    ${late.length ? `<p class="note">▶ の日は、その日の5枚をあとから遊べます（過去7日まで・続けた日には数えません）。</p>` : ""}
    ${footer()}`;
  $("back").onclick = home; $("prev").onclick = () => cal(ymAdd(ym, -1)); $("next").onclick = () => cal(ymAdd(ym, 1));
  document.querySelectorAll(".cal .miss").forEach((b) => (b.onclick = () => (lateDays(load()).includes(b.dataset.k) ? startRun("a", b.dataset.k) : cal(ym))));
  bindFooter(); toTop();
}

      <p>出てくる会社・商品・人・数字は、すべて架空です。問題は、資料の考え方を短くまとめたもので、法律の相談ではありません。買い物で困ったときは、消費者ホットライン「188」（いやや）で、近くの消費生活センターにつながります。</p>

window.__km = { mode: () => MODE, load, save, todayKey, dayNo, lateDays, ACH, achGot, nextAch, tally, shareText, streak, endlessList, moreList, ERAMP, TIPS, cur: () => cur, play: (m) => { if (m) MODE = m; play(); }, home, cal, book, about, EPOCH, KEY, G };
home();
if ("serviceWorker" in navigator && location.protocol === "https:" && /github\.io$/.test(location.hostname)) navigator.serviceWorker.register("sw.js").catch(() => {});
